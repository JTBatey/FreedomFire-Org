<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Find your page — Freedom Fire</title>
  <style>body{font:18px/1.6 system-ui,sans-serif;max-width:42rem;margin:12vh auto;padding:24px;color:#383838}h1,a{color:#8f0002}</style>
</head>
<body>
  <h1>Looking for a Freedom Fire page?</h1>
  <p id="message">This address may have changed. Please visit our homepage to find it.</p>
  <p><a id="destination" href="/">Visit the homepage</a></p>
  <noscript><p>JavaScript is needed to follow an old bookmark automatically.</p></noscript>
  <!-- Compatibility only: this map matches docs/page-map.json. -->
  <script>
  const legacyPages = {
  "/": "index.html",
  "/1-on-1-friendships": "1-on-1-friendships.html",
  "/blue-eye-retreat-center": "blue-eye-retreat-center.html",
  "/church-partnerships": "partnerships.html",
  "/partnerships": "partnerships.html",
  "/church": "church.html",
  "/contact": "contact.html",
  "/donate-1": "donate.html",
  "/education": "education.html",
  "/educational-videos": "educational-videos.html",
  "/freedom-church-downtown": "freedom-church-downtown.html",
  "/freedom-church-southside": "freedom-church-southside.html",
  "/freedom-works": "freedom-works.html",
  "/freedomfirevideos": "freedom-fire-videos.html",
  "/fuel-the-fire": "fuel-the-fire.html",
  "/home": "index.html",
  "/locations-1": "locations.html",
  "/lunch-learn": "lunch-learn.html",
  "/ourstaff": "staff.html",
  "/outreach": "outreach.html",
  "/planned-giving": "planned-giving.html",
  "/pdfs": "documents.html",
  "/photo-library": "photo-library.html",
  "/shalom-retreat-center": "shalom-retreat-center.html",
  "/testimonies": "testimonies.html",
  "/vision-mission": "vision-mission.html",
  "/volunteer": "volunteer.html",
  "/worship-wagon": "worship-wagon.html"
};
  function resolveLegacy(pathname) {
    let path;
    try { path = decodeURIComponent(pathname).replace(/\/index\.html$/, '').replace(/\/+$/, '') || '/'; }
    catch { return null; }
    for (const [oldPath, newPath] of Object.entries(legacyPages).sort((a,b) => b[0].length-a[0].length)) {
      if (oldPath !== '/' && (path === oldPath || path.endsWith(oldPath))) {
        return path.slice(0, -oldPath.length) + '/' + newPath;
      }
    }
    return path === '/' ? '/index.html' : null;
  }
  const target = resolveLegacy(location.pathname);
  if (target && target !== location.pathname) {
    const destination = target + location.search + location.hash;
    document.getElementById('message').textContent = 'This page has moved. Taking you to its new address…';
    const link = document.getElementById('destination');
    link.href = destination;
    link.textContent = 'Open the page';
    location.replace(destination);
  }
  </script>
</body>
</html>
